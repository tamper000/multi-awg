services:
  amneziawg:
    image: docker.io/amneziavpn/amneziawg-go:latest
    container_name: amneziawg
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./amnezia-config:/etc/amnezia/amneziawg:ro
      - ./scripts:/scripts:ro
    command: sh -c "/scripts/up.sh awg0 && exec tail -f /dev/null"
    ports:
      - "5060:51821/udp"
    networks:
      - vpn
    healthcheck:
      test: "test -d /sys/class/net/awg0"
      interval: "10s"
      timeout: "2s"
      retries: 3
      start_period: "5s"

  awg-proxy:
    image: ghcr.io/tamper000/multi-awg-proxy:latest
    container_name: awg-proxy
    volumes:
      - ./awg-proxy/proxy.toml:/workdir/proxy.toml:ro
      - ./amnezia-config/awg0.conf:/workdir/awg0.conf:ro
    command: ["/workdir/proxy.toml"]
    network_mode: service:amneziawg
    depends_on:
      amneziawg:
        condition: service_healthy
    healthcheck:
      test: "pidof proxy"
      interval: "10s"
      timeout: "2s"
      retries: 3
      start_period: "5s"

  worker:
    image: ghcr.io/tamper000/multi-awg-worker:latest
    container_name: multi-awg-worker
    env_file:
      - .env.worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./amnezia-config:/app/amnezia-config
      - ./mihomo-config/example.yaml:/etc/mihomo_template.yaml:ro
      - server-data:/data
    depends_on:
      - amneziawg
      - awg-proxy

  server:
    image: ghcr.io/tamper000/multi-awg-server:latest
    container_name: multi-awg-server
    env_file:
      - .env.server
    volumes:
      - server-data:/data
    ports:
      - "8080:8080"
    depends_on:
      - worker

networks:
  vpn:

volumes:
  server-data:
