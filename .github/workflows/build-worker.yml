name: Build and Publish Worker

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-worker

  TRACKED_PATHS: |
    Dockerfile.worker
    go.mod
    go.sum
    cmd/worker/

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check tracked files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"

          PREVIOUS_TAG=$(
            git tag --sort=-version:refname \
              | grep '^v' \
              | grep -vx "$CURRENT_TAG" \
              | head -n1
          )

          echo "Current tag: $CURRENT_TAG"
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREVIOUS_TAG" "$CURRENT_TAG")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          while IFS= read -r path; do
            [ -z "$path" ] && continue

            while IFS= read -r file; do
              if [[ "$file" == "$path" ]]; then
                echo "Matched file: $file"
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [[ "$path" == */ && "$file" == "$path"* ]]; then
                echo "Matched directory: $file"
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done <<< "$CHANGED_FILES"
          done <<< "$TRACKED_PATHS"

          echo "No tracked files changed."
          echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Skip build
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No tracked files changed since previous tag. Skipping build."

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.changes.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Worker
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max