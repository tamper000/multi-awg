rules:
    - DST-PORT,53,DIRECT
    - GEOIP,private,DIRECT,no-resolve

    - GEOIP,RU,WARP

    - MATCH,DIRECT

dns:
  enable: true
  respect-rules: true
  nameserver:
    - 94.140.14.14
    - 94.140.15.15
  direct-nameserver:
    - 94.140.14.14
    - 94.140.15.15
  proxy-server-nameserver:
