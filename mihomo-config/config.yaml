mode: rule

tun:
    enable: true
    stack: gvisor
    auto-route: false
    auto-redirect: false
    dns-hijack:
        - any:53
    auto-detect-interface: true
    device: mihomo0
    mtu: 1280

log-level: info

proxies:
  - name: "WARP"
    type: masque
    server: 162.159.198.2
    port: 443
    private-key: "MHcCAQEEIC1mQBCx10dgNwK0lMq4DWwObeEHn+nToLupbbzH6X+7oAoGCCqGSM49AwEHoUQDQgAE0muM5rmnYLzbSQjvhwNqpoXPrbmm8uyD+IYMxY566acZwRZ5c4CALmmoMqveKOy8xaZEOjM/PSqRTvr1hHj/wQ=="
    public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w=="
    ip: 172.16.0.2
    ipv6: 2606:4700:110:8392:c42f:5d2f:bae0:cb3a
    mtu: 1280
    udp: true
    sni: consumer-masque.cloudflareclient.com
